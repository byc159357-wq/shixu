name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg.version -ne $tagVersion) {
            throw "Git tag $tagVersion does not match package.json version $($pkg.version)."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build installer and update metadata
        run: npm run pack

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-shixu/Shixu-Setup-*.exe
            dist-shixu/Shixu-Setup-*.exe.blockmap
            dist-shixu/latest.yml
