name: 功能建议
description: 提议新的能力或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想的行为或界面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你目前如何解决，或还考虑过哪些做法？
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 首页工作台
        - 项目与任务
        - 文件资料库
        - 日历与倒计时
        - AI 助手
        - 设置与数据
        - 其他
    validations:
      required: true

